# .claude/denetim.conf — hangi dosya değişince hangi denetim koşar.
# denetle.sh okur. Her blok:
#   [ad]
#   desen = <boşlukla ayrılmış glob'lar; * dizinleri de kapsar>
#   hizli = <implementer'ın koşacağı hızlı komut; yoksa yazma>
#   tam   = <verifier'ın koşacağı tam komut; yoksa hizli kullanılır>
# Yer tutucular: {dosyalar} değişen dosyalar, {yeni} yeni dosyalar.
# Komutlar proje kökünde `bash -c` ile koşar; çıkış kodu 0 = geçti.

[analiz]
desen = lib/* test/*
hizli = flutter analyze {dosyalar}
tam   = flutter analyze

[test]
desen = lib/* test/*
hizli = flutter test
tam   = flutter test

[paketler]
desen = pubspec.yaml
tam   = flutter pub get && flutter analyze

[macos]
desen = macos/*
tam   = flutter build macos --debug
